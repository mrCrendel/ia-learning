[project]
name = "ai-learning"
version = "0.1.0"
description = "Учебный репозиторий курса AI-инженерии"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "openai",
    "pydantic",
    "httpx",
    "python-dotenv",
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: реальные вызовы к API, тратят токены"]
addopts = "-m 'not live'"
pythonpath = ["week-02"]
